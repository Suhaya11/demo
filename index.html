<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="body-wrapper">
        <div class="game-container">
            <section class="player--0 active-player-bg">

                <h2 class="player-name">PLAYER 1</h2>

                <h1 class="player--0--score">1082</h1>
                <div class="current--score">
                    <p>current</p>
                    <h3 class="current--0--player--score">0</h3>
                </div>
            </section>
            <div class="new-game">
                <p onclick="reset()">🔄 NEW GAME</p>
            </div>
            <img class="diceBall" src="dice-1.png" alt="">
            <div class="roll-dice-btn">🎲 ROLL DICE</div>
            <p class="hold-score">✔ HOLD</p>
            <h2 class="win hide">😃WIN!!!</h2>




            <section class="player--1">
                <div class="player-1-name">
                    <h2 class="player-name">PLAYER 2</h2>
                </div>
                <h1 class="player--1--score">1082</h1>
                <div class="current--score">
                    <p>current</p>
                    <h3 class="current--1--player--score">0</h3>
                </div>

            </section>



        </div>





    </div>


    <script src="script.js"></script>
</body>

</html>
